name: Check ✅

on:
  workflow_dispatch:
  push:
    paths:
      - "*"
  pull_request:
    paths:
      - "*"

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛒
        uses: actions/checkout@v5

      - name: Toolchain 🧰
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: nightly-2022-05-18
          components: rustfmt, clippy
          override: true

      - name: Check ✅
        uses: actions-rs/cargo@v1
        continue-on-error: false
        with:
          command: check
          args: --verbose
